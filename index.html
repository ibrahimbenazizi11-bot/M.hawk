<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.hawk VIP - Global Streaming Platform</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #161e2e;
            --accent-color: #38bdf8;
            --vip-gold: #f59e0b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background-color: rgba(11, 15, 25, 0.98);
            border-bottom: 1px solid #1e293b;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo { font-size: 24px; font-weight: bold; color: var(--accent-color); letter-spacing: 1px; }
        
        .main-container { max-width: 1300px; margin: 0 auto; padding: 30px 20px; }
        
        /* شريط التوب بار والأقسام */
        .top-nav-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #1e293b;
        }
        .categories-bar {
            display: flex;
            gap: 10px;
        }
        .cat-btn {
            background: #0b0f19;
            color: var(--text-color);
            border: 1px solid #1e293b;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .cat-btn.active, .cat-btn:hover {
            background: var(--accent-color);
            color: #0b0f19;
            border-color: var(--accent-color);
        }

        /* شريط اختيار اللغات */
        .language-selector-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .language-select {
            background-color: #0b0f19;
            color: var(--text-color);
            border: 1px solid var(--accent-color);
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            outline: none;
        }

        /* قسم عرض المحتوى */
        .content-section {
            margin-bottom: 50px;
        }
        .section-title {
            font-size: 22px;
            color: #fff;
            margin-bottom: 20px;
            border-left: 4px solid var(--accent-color);
            padding-left: 10px;
        }
        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 20px;
        }
        .media-card {
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #1e293b;
            padding: 15px;
            text-align: center;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            color: var(--text-muted);
        }

        /* بطاقة بايبال VIP بشكل منظم أسفل الصفحة */
        .pricing-section {
            display: flex;
            justify-content: center;
            margin-top: 60px;
            margin-bottom: 40px;
        }
        .pricing-card {
            background: linear-gradient(135deg, #1e293b 0%, #0b0f19 100%);
            border: 2px solid var(--vip-gold);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }
        .pricing-card h3 { color: var(--vip-gold); font-size: 28px; margin-bottom: 10px; }
        .price { font-size: 42px; font-weight: bold; color: #fff; margin-bottom: 15px; }
        .price span { font-size: 14px; color: var(--text-muted); }
        .btn-vip {
            display: block;
            background-color: var(--vip-gold);
            color: #000;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            text-decoration: none;
            transition: 0.3s;
            margin-top: 25px;
        }
        .btn-vip:hover { background-color: #d97706; transform: scale(1.02); }
    </style>
</head>
<body>

    <header>
        <div class="logo">M.hawk VIP</div>
        <div style="color: var(--text-muted); font-size: 14px;">Free Stream (720p/1080p) & VIP 4K</div>
    </header>

    <div class="main-container">
        
        <!-- شريط التحكم العلوي: الأقسام واختيار اللغات -->
        <div class="top-nav-section">
            <div class="categories-bar">
                <button class="cat-btn active" onclick="switchCategory('movie', this)">🎬 Movies</button>
                <button class="cat-btn" onclick="switchCategory('tv', this)">📺 Series</button>
                <button class="cat-btn" onclick="switchCategory('anime', this)">⛩️ Anime</button>
            </div>

            <div class="language-selector-box">
                <label style="font-size: 14px; color: var(--text-muted);">Language (14):</label>
                <select class="language-select" id="languageSelector" onchange="changeLanguage(this.value)">
                    <option value="id">🇮🇩 Indonesian (Bahasa)</option>
                    <option value="hi">🇮🇳 Hindi (हिन्दी)</option>
                    <option value="en" selected>🇬🇧 English</option>
                    <option value="ar">🇸🇦 Arabic</option>
                    <option value="es">🇪🇸 Spanish</option>
                    <option value="fr">🇫🇷 French</option>
                    <option value="de">🇩🇪 German</option>
                    <option value="pt">🇵🇹 Portuguese</option>
                    <option value="ja">🇯🇵 Japanese</option>
                    <option value="ko">🇰🇷 Korean</option>
                    <option value="it">🇮🇹 Italian</option>
                    <option value="tr">🇹🇷 Turkish</option>
                    <option value="ru">🇷🇺 Russian</option>
                    <option value="zh">🇨🇳 Chinese</option>
                </select>
            </div>
        </div>

        <!-- قسم عرض محتوى الأفلام والمسلسلات والأنمي -->
        <div class="content-section">
            <div class="section-title" id="sectionTitle">Trending Movies</div>
            <div class="media-grid" id="mediaGrid">
                <div class="media-card">Loading content...</div>
                <div class="media-card">Loading content...</div>
                <div class="media-card">Loading content...</div>
                <div class="media-card">Loading content...</div>
            </div>
        </div>

        <!-- بطاقة بايبال VIP الاحترافية في الأسفل -->
        <div class="pricing-section">
            <div class="pricing-card">
                <h3>VIP 4K Access</h3>
                <div class="price">$3 <span>/ month</span></div>
                <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 10px;">
                    Unlock ultimate 4K streaming, zero ads, and 14 language subtitles support.
                </p>
                <!-- رابط بايبال الخاص بك -->
                <a href="https://www.paypal.com/ncp/payment/6VTSA8XPY887S" target="_blank" class="btn-vip">Upgrade to VIP 4K</a>
            </div>
        </div>

    </div>

    <script>
        let currentCategory = 'movie';
        let currentLang = 'en';

        function switchCategory(type, btn) {
            currentCategory = type;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');

            const title = document.getElementById('sectionTitle');
            const grid = document.getElementById('mediaGrid');

            if(type === 'movie') title.innerText = 'Trending Movies';
            else if(type === 'tv') title.innerText = 'Popular TV Series';
            else if(type === 'anime') title.innerText = 'Top Anime Hub';

            grid.innerHTML = `<div class="media-card">Loading ${type} (${currentLang.toUpperCase()})...</div>`.repeat(4);
        }

        function changeLanguage(langCode) {
            currentLang = langCode;
            switchCategory(currentCategory, document.querySelector('.cat-btn.active'));
        }
    </script>
</body>
</html>
