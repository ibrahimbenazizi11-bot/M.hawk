<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.hawk VIP - Top Rated Edition</title>
    <style>
        :root {
            --bg-color: #0b0f13;
            --card-bg: #141923;
            --accent-red: #E50914;
            --accent-red-hover: #b20710;
            --vip-gold: #f59e0b;
            --text-color: #ffffff;
            --text-muted: #9ca3af;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background-color: rgba(11, 15, 19, 0.95);
            border-bottom: 1px solid #1f2937;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo { font-size: 26px; font-weight: bold; color: var(--accent-red); letter-spacing: 1px; }
        
        .main-container { max-width: 1300px; margin: 0 auto; padding: 30px 20px; }
        
        /* شريط التحكم العلوي: الأقسام واختيار اللغات */
        .top-nav-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #1f2937;
        }
        .categories-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .cat-btn {
            background: #0b0f13;
            color: var(--text-color);
            border: 1px solid #1f2937;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .cat-btn.active, .cat-btn:hover {
            background: var(--accent-red);
            color: #fff;
            border-color: var(--accent-red);
        }

        /* شريط اختيار اللغات */
        .language-selector-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .language-select {
            background-color: #0b0f13;
            color: var(--text-color);
            border: 1px solid var(--accent-red);
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            outline: none;
        }
        .language-select option {
            background-color: var(--card-bg);
            color: var(--text-color);
        }

        /* قسم عرض المحتوى */
        .content-section {
            margin-bottom: 50px;
        }
        .section-title {
            font-size: 22px;
            color: #fff;
            margin-bottom: 20px;
            border-left: 4px solid var(--accent-red);
            padding-left: 10px;
        }
        
        /* شبكة عرض الأفلام والمسلسلات */
        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        .media-card {
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #1f2937;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }
        .media-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(229, 9, 20, 0.3);
        }
        .media-card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
        }
        .media-info {
            padding: 12px;
        }
        .media-info h4 {
            font-size: 15px;
            color: #fff;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .media-info p {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        /* بطاقة بايبال VIP ($3) */
        .pricing-section {
            display: flex;
            justify-content: center;
            margin-top: 60px;
            margin-bottom: 40px;
        }
        .pricing-card {
            background: linear-gradient(135deg, #1f2937 0%, #0b0f13 100%);
            border: 2px solid var(--vip-gold);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }
        .pricing-card h3 { color: var(--vip-gold); font-size: 28px; margin-bottom: 10px; }
        .price { font-size: 42px; font-weight: bold; color: #fff; margin-bottom: 15px; }
        .price span { font-size: 14px; color: var(--text-muted); }
        .btn-vip {
            display: block;
            background-color: var(--vip-gold);
            color: #000;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            text-decoration: none;
            transition: 0.3s;
            margin-top: 25px;
        }
        .btn-vip:hover { background-color: #d97706; transform: scale(1.02); }
    </style>
</head>
<body>

    <header>
        <div class="logo">M.hawk VIP</div>
        <div style="color: var(--text-muted); font-size: 14px;">Top Rated Hub</div>
    </header>

    <div class="main-container">
        
        <!-- شريط التحكم العلوي: الأقسام واختيار اللغات -->
        <div class="top-nav-section">
            <div class="categories-bar">
                <button class="cat-btn active" onclick="switchCategory('movie', this)">🔥 Top Movies</button>
                <button class="cat-btn" onclick="switchCategory('tv', this)">⭐ Top Series</button>
                <button class="cat-btn" onclick="switchCategory('anime', this)">⛩️ Top Anime</button>
            </div>

            <div class="language-selector-box">
                <label style="font-size: 14px; color: var(--text-muted);">Language:</label>
                <select class="language-select" id="languageSelector" onchange="changeLanguage(this.value)">
                    <option value="id">🇮🇩 Indonesian (Bahasa)</option>
                    <option value="hi">🇮🇳 Hindi (हिन्दी)</option>
                    <option value="en" selected>🇬🇧 English</option>
                    <option value="ar">🇸🇦 Arabic</option>
                    <option value="es">🇪🇸 Spanish</option>
                    <option value="fr">🇫🇷 French</option>
                    <option value="de">🇩🇪 German</option>
                    <option value="pt">🇵🇹 Portuguese</option>
                    <option value="ja">🇯🇵 Japanese</option>
                    <option value="ko">🇰🇷 Korean</option>
                    <option value="it">🇮🇹 Italian</option>
                    <option value="tr">🇹🇷 Turkish</option>
                    <option value="ru">🇷🇺 Russian</option>
                    <option value="zh">🇨🇳 Chinese</option>
                </select>
            </div>
        </div>

        <!-- قسم عرض المحتوى الأعلى تقييماً -->
        <div class="content-section">
            <div class="section-title" id="sectionTitle">Top Rated Movies</div>
            <div class="media-grid" id="mediaGrid">
                <!-- سيتم جلب وعرض الأفلام والمسلسلات الأعلى تقييماً هنا ديناميكياً -->
            </div>
        </div>

        <!-- بطاقة بايبال VIP ($3) -->
        <div class="pricing-section">
            <div class="pricing-card">
                <h3>VIP 4K Access</h3>
                <div class="price">$3 <span>/ month</span></div>
                <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 10px;">
                    Unlock ultimate 4K streaming, zero ads, and 14 language subtitles support.
                </p>
                <a href="https://www.paypal.com/ncp/payment/6VTSA8XPY887S" target="_blank" class="btn-vip">Upgrade to VIP 4K</a>
            </div>
        </div>

    </div>

    <script>
        const API_KEY = '65fb47dac159884604660e91b9fbe2d3'; 
        let currentType = 'movie';
        let currentLang = 'en';

        async function fetchMedia() {
            const grid = document.getElementById('mediaGrid');
            const titleEl = document.getElementById('sectionTitle');
            
            grid.innerHTML = '<p style="color:#9ca3af; grid-column: 1/-1; text-align:center;">Loading top-rated content...</p>';

            let url = '';
            if (currentType === 'movie') {
                titleEl.innerText = 'Top Rated Global Movies';
                url = `https://api.themoviedb.org/3/movie/top_rated?api_key=${API_KEY}&language=${currentLang}&page=1`;
            } else if (currentType === 'tv') {
                titleEl.innerText = 'Top Rated Global TV Series';
                url = `https://api.themoviedb.org/3/tv/top_rated?api_key=${API_KEY}&language=${currentLang}&page=1`;
            } else if (currentType === 'anime') {
                titleEl.innerText = 'Top Rated Anime Masterpieces';
                // جلب مسلسلات الأنشطة/الأنمي الأعلى تقييماً (تصنيف Animation مع الفلترة حسب التقييم)
                url = `https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&with_genres=16&sort_by=vote_average.desc&vote_count.gte=500&language=${currentLang}`;
            }

            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.results && data.results.length > 0) {
                    grid.innerHTML = '';
                    data.results.forEach(item => {
                        const title = item.title || item.name || 'Untitled';
                        const poster = item.poster_path ? `https://image.tmdb.org/t/p/w500${item.poster_path}` : 'https://via.placeholder.com/200x280?text=No+Image';
                        const vote = item.vote_average ? item.vote_average.toFixed(1) : 'N/A';
                        const date = (item.release_date || item.first_air_date || '').substring(0, 4);

                        const card = document.createElement('div');
                        card.className = 'media-card';
                        // جعل الفيلم/المسلسل قابلاً للنقر لفتح البث المباشر (لإتاحة المشاهدة لك وللزبائن)
                        card.onclick = () => {
                            const mediaId = item.id;
                            const streamType = currentType === 'movie' ? 'movie' : 'tv';
                            const playerUrl = `https://vidsrc.xyz/embed/${streamType}?tmdb=${mediaId}`;
                            window.open(playerUrl, '_blank');
                        };

                        card.innerHTML = `
                            <img src="${poster}" alt="${title}">
                            <div class="media-info">
                                <h4>${title}</h4>
                                <p><span>${date}</span> <span style="color: #f59e0b;">★ ${vote}</span></p>
                            </div>
                        `;
                        grid.appendChild(card);
                    });
                } else {
                    grid.innerHTML = '<p style="color:#9ca3af; grid-column: 1/-1; text-align:center;">No results found.</p>';
                }
            } catch (error) {
                console.error('Error fetching TMDB data:', error);
                grid.innerHTML = '<p style="color:#E50914; grid-column: 1/-1; text-align:center;">Failed to load data. Please check your API Key.</p>';
            }
        }

        function switchCategory(type, btn) {
            currentType = type;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            fetchMedia();
        }

        function changeLanguage(langCode) {
            currentLang = langCode;
            fetchMedia();
        }

        // التشغيل الأولي عند فتح الصفحة
        fetchMedia();
    </script>
</body>
</html>
