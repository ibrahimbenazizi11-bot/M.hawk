<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.hawk Platform - Ultimate Entertainment</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 27, 34, 0.85);
            --card-hover: rgba(30, 41, 59, 0.95);
            --accent-color: #e50914;
            --gold-color: #f59e0b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 20px 40px;
            background: rgba(11, 15, 25, 0.9);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent-color);
        }
        main {
            flex: 1;
            padding: 40px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }
        h1 {
            margin-bottom: 20px;
            font-size: 28px;
        }
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .movie-card {
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: transform 0.3s ease;
            cursor: pointer;
        }
        .movie-card:hover {
            transform: scale(1.05);
            background: var(--card-hover);
        }
        .movie-card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }
        .movie-info {
            padding: 12px;
        }
        .movie-title {
            font-size: 16px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .movie-date {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 5px;
        }
        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-color);
            margin-top: auto;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">M.hawk</div>
    </header>
    <main>
        <h1>Trending Movies</h1>
        <div id="movies-container" class="movies-grid">
            <p style="color: var(--text-secondary);">Loading amazing content from TMDB...</p>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 M.hawk Entertainment Hub. All rights reserved.</p>
    </footer>

    <script>
        const API_KEY = '65fb47dac159884604660e91b9fbe2d3';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMAGE_BASE_URL = 'https://image.tmdb.org/t/p/w500';

        async function fetchTrendingMovies() {
            try {
                const response = await fetch(`${BASE_URL}/trending/movie/day?api_key=${API_KEY}`);
                const data = await response.json();
                
                if (data.results) {
                    displayMovies(data.results);
                }
            } catch (error) {
                console.error('Error fetching movies:', error);
                document.getElementById('movies-container').innerHTML = '<p style="color: var(--accent-color);">Failed to load content. Please check API key.</p>';
            }
        }

        function displayMovies(movies) {
            const container = document.getElementById('movies-container');
            container.innerHTML = '';

            movies.forEach(movie => {
                const posterPath = movie.poster_path ? `${IMAGE_BASE_URL}${movie.poster_path}` : 'https://via.placeholder.com/200x300?text=No+Image';
                
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <img src="${posterPath}" alt="${movie.title || movie.name}">
                    <div class="movie-info">
                        <div class="movie-title">${movie.title || movie.name}</div>
                        <div class="movie-date">${movie.release_date || movie.first_air_date || 'N/A'}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // تشغيل الدالة لجلب الأفلام فور تحميل الصفحة
        fetchTrendingMovies();
    </script>
</body>
</html>
