<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.hawk Platform - Ultimate Entertainment</title>
    <!-- ربط ملف الـ PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 27, 34, 0.75);
            --card-hover: rgba(30, 41, 59, 0.9);
            --accent-color: #e50914;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent-color);
        }

        .container {
            flex: 1;
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .hero {
            text-align: center;
            padding: 60px 20px;
        }

        .hero h1 {
            font-size: 38px;
            margin-bottom: 15px;
        }

        .hero p {
            color: var(--text-secondary);
            font-size: 18px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">M.hawk VIP</div>
    </header>

    <div class="container">
        <div class="hero">
            <h1>مرحباً بك في منصة الأفلام الحصرية</h1>
            <p>استمتع بأقوى العروض وبجودة 4K فائقة الوضوح.</p>
        </div>
    </div>

    <!-- تفعيل وتشغيل الـ Service Worker لتطبيق الـ PWA -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js')
          .then(() => console.log('تم تفعيل تطبيق PWA بنجاح'))
          .catch((err) => console.log('فشل تفعيل الـ PWA', err));
      }
    </script>
</body>
</html>
