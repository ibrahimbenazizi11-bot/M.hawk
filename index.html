<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.hawk VIP - Global Streaming Platform</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #161e2e;
            --accent-color: #38bdf8;
            --vip-gold: #f59e0b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: rgba(11, 15, 25, 0.95);
            border-bottom: 1px solid #1e293b;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo { font-size: 24px; font-weight: bold; color: var(--accent-color); }
        
        .header-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        /* تنسيق شريط اختيار اللغات */
        .language-select {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid #38bdf8;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }
        .language-select option {
            background-color: var(--card-bg);
            color: var(--text-color);
        }

        .container { max-width: 1300px; margin: 0 auto; padding: 30px 20px; }
        
        /* قسم التنقل بين الأقسام */
        .categories-bar {
            display: flex;
            gap: 15px;
            margin: 20px 0;
            overflow-x: auto;
            padding-bottom: 10px;
        }
        .cat-btn {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid #1e293b;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            white-space: nowrap;
        }
        .cat-btn.active, .cat-btn:hover {
            background: var(--accent-color);
            color: #0b0f19;
            border-color: var(--accent-color);
        }

        .section-title {
            font-size: 22px;
            color: #fff;
            margin: 30px 0 15px 0;
            border-left: 4px solid var(--accent-color);
            padding-left: 10px;
        }

        /* شبكة عرض المحتوى الديناميكي */
        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .media-card {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #1e293b;
            transition: transform 0.3s;
        }
        .media-card:hover { transform: scale(1.03); }
        .media-card img { width: 100%; height: 280px; object-fit: cover; }
        .media-info { padding: 12px; }
        .media-info h4 { font-size: 15px; color: #fff; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .media-info p { font-size: 13px; color: var(--text-muted); }

        /* بطاقة VIP */
        .pricing-card {
            background: linear-gradient(135deg, #1e293b 0%, #0b0f19 100%);
            border: 2px solid var(--vip-gold);
            border-radius: 12px;
            padding: 30px;
            max-width: 450px;
            margin: 40px auto;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }
        .pricing-card h3 { color: var(--vip-gold); font-size: 26px; margin-bottom: 10px; }
        .price { font-size: 40px; font-weight: bold; color: #fff; margin-bottom: 20px; }
        .price span { font-size: 14px; color: var(--text-muted); }
        .btn-vip {
            display: block;
            background-color: var(--vip-gold);
            color: #000;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            text-decoration: none;
            transition: 0.3s;
            margin-top: 20px;
        }
        .btn-vip:hover { background-color: #d97706; }
    </style>
</head>
<body>

    <header>
        <div class="logo">M.hawk VIP</div>
        <div class="header-controls">
            <!-- شريط اختيار اللغات الـ 14 -->
            <select class="language-select" id="languageSelector" onchange="changeLanguage(this.value)">
                <option value="id">🇮🇩 Indonesian (Bahasa)</option>
                <option value="hi">🇮🇳 Hindi (हिन्दी)</option>
                <option value="en" selected>🇬🇧 English</option>
                <option value="ar">🇸🇦 Arabic (العربية)</option>
                <option value="es">🇪🇸 Spanish (Español)</option>
                <option value="fr">🇫🇷 French (Français)</option>
                <option value="de">🇩🇪 German (Deutsch)</option>
                <option value="pt">🇵🇹 Portuguese (Português)</option>
                <option value="ja">🇯🇵 Japanese (日本語)</option>
                <option value="ko">🇰🇷 Korean (한국어)</option>
                <option value="it">🇮🇹 Italian (Italiano)</option>
                <option value="tr">🇹🇷 Turkish (Türkçe)</option>
                <option value="ru">🇷🇺 Russian (Русский)</option>
                <option value="zh">🇨🇳 Chinese (中文)</option>
            </select>
        </div>
    </header>

    <div class="container">
        
        <!-- الأقسام الثلاثة الرئيسية -->
        <div class="categories-bar">
            <button class="cat-btn active" onclick="switchCategory('movie', this)">🎬 Movies (أفلام)</button>
            <button class="cat-btn" onclick="switchCategory('tv', this)">📺 TV Series (مسلسلات)</button>
            <button class="cat-btn" onclick="switchCategory('anime', this)">⛩️ Anime (أنمي)</button>
        </div>

        <!-- منطقة عرض المحتوى (API) -->
        <div class="section-title" id="sectionTitle">Trending Movies</div>
        <div class="media-grid" id="mediaGrid">
            <!-- سيتم جلب المحتوى وعرضه ديناميكياً هنا -->
        </div>

        <!-- بطاقة اشتراك بايبال VIP ($3) -->
        <div class="pricing-card">
            <h3>VIP 4K Access</h3>
            <div class="price">$3 <span>/ month</span></div>
            <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 15px;">
                Unlock ultimate 4K streaming, ad-free experience, and priority servers.
            </p>
            <!-- رابط بايبال الخاص بك -->
            <a href="https://www.paypal.com/ncp/payment/6VTSA8XPY887S" target="_blank" class="btn-vip">Upgrade to VIP 4K</a>
        </div>

    </div>

    <script>
        let currentCategory = 'movie';
        let currentLang = 'en';

        function switchCategory(type, btn) {
            currentCategory = type;
            
            // تحديث الأزرار النشطة
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const title = document.getElementById('sectionTitle');
            const grid = document.getElementById('mediaGrid');

            if(type === 'movie') {
                title.innerText = 'Trending Movies';
            } else if(type === 'tv') {
                title.innerText = 'Popular TV Series';
            } else if(type === 'anime') {
                title.innerText = 'Top Anime Hub';
            }

            grid.innerHTML = `<p style="color:#94a3b8;">Loading ${type} in language: ${currentLang.toUpperCase()}...</p>`;
            
            // هنا يمكنك ربط دالة جلب البيانات الخاصة بـ TMDB API وتمرير متغيرات (currentCategory و currentLang) معاً
        }

        function changeLanguage(langCode) {
            currentLang = langCode;
            console.log("Language changed to: " + langCode);
            // إعادة جلب المحتوى باللغة المختارة فوراً
            switchCategory(currentCategory, document.querySelector('.cat-btn.active'));
        }
    </script>
</body>
</html>
