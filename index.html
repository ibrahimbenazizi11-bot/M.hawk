<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.hawk Platform - Ultimate Entertainment</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 27, 34, 0.85);
            --card-hover: rgba(30, 41, 59, 0.95);
            --accent-color: #e50914;
            --gold-color: #f59e0b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg-color) 70%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* شريط الاشتراك المميز VIP 4K */
        .vip-banner {
            width: 100%;
            background: linear-gradient(90deg, #b91c1c, #e50914, #f59e0b);
            color: #fff;
            padding: 12px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            font-weight: 700;
            font-size: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.3);
            z-index: 1001;
            flex-wrap: wrap;
        }

        .vip-btn {
            background: #fff;
            color: #e50914;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .vip-btn:hover {
            background: #f8fafc;
            transform: scale(1.05);
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }

        /* شريط التنقل العلوي */
        header {
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            gap: 20px;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 26px;
            font-weight: 800;
            color: var(--accent-color);
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(229, 9, 20, 0.4);
        }

        .search-container {
            flex: 1;
            max-width: 400px;
            position: relative;
        }

        .search-input {
            width: 100%;
            background: rgba(15, 23, 42, 0.9);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 15px rgba(229, 9, 20, 0.3);
        }

        .header-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .watchlist-nav-btn {
            background: rgba(229, 9, 20, 0.2);
            color: var(--text-primary);
            border: 1px solid var(--accent-color);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .watchlist-nav-btn:hover {
            background: var(--accent-color);
        }

        .lang-select {
            background: rgba(15, 23, 42, 0.9);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            outline: none;
        }

        .lang-select:hover {
            border-color: var(--accent-color);
        }

        /* المحتوى الرئيسي */
        main {
            max-width: 1300px;
            width: 100%;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            flex: 1;
        }

        .hero-section {
            text-align: center;
            max-width: 800px;
        }

        .hero-section h1 {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 15px;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-section p {
            font-size: 16px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        /* شريط التصفية بالأقسام الـ 7 المنظمة */
        .filter-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            width: 100%;
            margin-bottom: 10px;
        }

        .filter-btn {
            background: rgba(22, 27, 34, 0.8);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 10px 18px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
            box-shadow: 0 0 15px rgba(229, 9, 20, 0.4);
            transform: translateY(-2px);
        }

        /* شبكة عرض المحتوى */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
            width: 100%;
        }

        .media-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: all 0.4s ease;
            position: relative;
        }

        .media-card:hover {
            transform: translateY(-8px);
            border-color: rgba(229, 9, 20, 0.5);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        .media-poster {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            background: #1e293b;
        }

        .media-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .media-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .media-meta {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .media-rating {
            color: var(--gold-color);
            font-weight: 700;
        }

        /* نافذة التفاصيل ومشغل الفيديو */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 2000;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: #131b2e;
            border: 1px solid rgba(229, 9, 20, 0.3);
            border-radius: 20px;
            width: 90%;
            max-width: 800px;
            padding: 35px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s ease;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
            z-index: 10;
        }

        .modal-close:hover {
            color: var(--accent-color);
        }

        .video-container {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            display: none;
            margin-bottom: 15px;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal-title {
            font-size: 26px;
            font-weight: 800;
            color: var(--text-primary);
        }

        .modal-desc {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .modal-actions {
            display: flex;
            gap: 15px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .play-btn {
            background: var(--accent-color);
            color: #fff;
        }

        .play-btn:hover {
            background: #b91c1c;
        }

        .watchlist-btn {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .watchlist-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        footer {
            width: 100%;
            text-align: center;
            padding: 25px;
            color: var(--text-secondary);
            font-size: 13px;
            border-top: 1px solid var(--border-color);
            background: rgba(11, 15, 25, 0.5);
        }
    </style>
</head>
<body>

    <div class="vip-banner">
        <span id="vipText">⭐ Upgrade your experience: Get exclusive 4K quality & ad-free streaming for only $5/month!</span>
        <button class="vip-btn" id="vipBtn" onclick="alert('Subscription feature coming soon!')">Subscribe Now</button>
    </div>

    <header>
        <div class="logo">M.hawk</div>
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="Search across all categories..." onkeyup="searchMedia()">
        </div>
        <div class="header-actions">
            <button class="watchlist-nav-btn" onclick="showWatchlist()">⭐ Watchlist (<span id="watchlistCount">0</span>)</button>
            <select id="langSelect" class="lang-select" onchange="changeLanguage(this.value)">
                <option value="en" selected>English</option>
                <option value="ar">العربية (Arabic)</option>
                <option value="fr">Français</option>
                <option value="es">Español</option>
                <option value="de">Deutsch</option>
                <option value="it">Italiano</option>
                <option value="ja">日本語 (Japanese)</option>
                <option value="ko">한국어 (Korean)</option>
                <option value="zh">中文 (Chinese)</option>
                <option value="id">Bahasa Indonesia</option>
                <option value="ru">Русский (Russian)</option>
                <option value="tr">Türkçe</option>
                <option value="pt">Português</option>
                <option value="nl">Nederlands</option>
                <option value="pl">Polski</option>
            </select>
        </div>
    </header>

    <main>
        <section class="hero-section">
            <h1 id="heroTitle">M.hawk Cinematic Platform</h1>
            <p id="heroDesc">Choose your favorite category: Movies, Series, Anime, Animation, Documentaries, Football, or UFC.</p>
        </section>

        <!-- شريط الأقسام السبعة المنظمة -->
        <div class="filter-bar">
            <button class="filter-btn active" onclick="switchCategory('movies', this)" id="btnMovies">🎬 Movies</button>
            <button class="filter-btn" onclick="switchCategory('series', this)" id="btnSeries">📺 Series</button>
            <button class="filter-btn" onclick="switchCategory('anime', this)" id="btnAnime">⛩️ Anime</button>
            <button class="filter-btn" onclick="switchCategory('animation', this)" id="btnAnimation">🎨 Animation</button>
            <button class="filter-btn" onclick="switchCategory('documentaries', this)" id="btnDocs">🌍 Documentaries</button>
            <button class="filter-btn" onclick="switchCategory('football', this)" id="btnFootball">⚽ Football Live</button>
            <button class="filter-btn" onclick="switchCategory('ufc', this)" id="btnUfc">🥊 UFC Live</button>
        </div>

        <!-- شبكة العرض -->
        <div class="grid-container" id="mediaGrid">
            <!-- يظهر المحتوى بناءً على القسم المختار -->
        </div>
    </main>

    <!-- نافذة التفاصيل والمشغل -->
    <div id="mediaModal" class="modal-overlay" onclick="closeModalOutside(event)">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            
            <div id="videoContainer" class="video-container">
                <video id="modalVideo" controls>
                    <source id="videoSource" src="" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>

            <h2 id="modalTitle" class="modal-title">Title</h2>
            <p id="modalDesc" class="modal-desc">Overview...</p>
            
            <div class="modal-actions">
                <button class="action-btn play-btn" onclick="playVideo()">▶ Play Now</button>
                <button class="action-btn watchlist-btn" id="modalWatchlistBtn" onclick="toggleWatchlist()">⭐ Add to Watchlist</button>
            </div>
        </div>
    </div>

    <footer>
        <p id="footerText">&copy; 2026 M.hawk Entertainment Hub. All rights reserved.</p>
    </footer>

    <script>
        const API_KEY = 'c44336c1e57c6b5478ebbc61d3106d88';
        let currentCategoryData = [];
        let selectedItem = null;
        let watchlist = JSON.parse(localStorage.getItem('m_hawk_watchlist')) || [];

        function updateWatchlistCount() {
            document.getElementById('watchlistCount').innerText = watchlist.length;
        }
        updateWatchlistCount();

        // فيديوهات البث الافتراضية للأقسام الحية أو الأفلام
        const sampleVideos = {
            movies: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4",
            series: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4",
            anime: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4",
            animation: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",
            documentaries: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/SubaruOutbackSeeTheWorld.mp4",
            football: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
            ufc: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4"
        };

        let activeCategory = 'movies';

        async function switchCategory(category, btnElement) {
            activeCategory = category;
            if(btnElement) {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btnElement.classList.add('active');
            }

            if(category === 'football' || category === 'ufc') {
                loadLiveSports(category);
                return;
            }

            let url = `https://api.themoviedb.org/3/movie/popular?api_key=${API_KEY}`;
            if(category === 'series') url = `https://api.themoviedb.org/3/tv/popular?api_key=${API_KEY}`;
            if(category === 'anime') url = `https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&with_genres=16`;
            if(category === 'animation') url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=16`;
            if(category === 'documentaries') url = `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=99`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                currentCategoryData = data.results.map(item => ({...item, category: category}));
                displayMedia(currentCategoryData);
            } catch (err) {
                console.error("Error fetching data:", err);
            }
        }

        function loadLiveSports(sport) {
            const liveItems = sport === 'football' ? [
                { id: 'f1', title: 'UEFA Champions League: Final Live', overview: 'Watch the ultimate showdown of European clubs in 4K HD live streaming.', poster_path: null, vote_average: 9.9, category: 'football', videoUrl: sampleVideos.football },
                { id: 'f2', title: 'Premier League: Top Matchday Broadcast', overview: 'Live coverage of the fiercest English Premier League matches.', poster_path: null, vote_average: 9.5, category: 'football', videoUrl: sampleVideos.football }
            ] : [
                { id: 'u1', title: 'UFC Pay-Per-View Main Event Live', overview: 'The biggest mixed martial arts championship fights broadcasted live.', poster_path: null, vote_average: 9.8, category: 'ufc', videoUrl: sampleVideos.ufc },
                { id: 'u2', title: 'UFC Fight Night: Championship Bouts', overview: 'Live explosive knockouts and title contenders showdown.', poster_path: null, vote_average: 9.6, category: 'ufc', videoUrl: sampleVideos.ufc }
            ];

            currentCategoryData = liveItems;
            displayMedia(currentCategoryData);
        }

        function displayMedia(items) {
            const grid = document.getElementById('mediaGrid');
            grid.innerHTML = '';

            items.forEach(item => {
                const title = item.title || item.name || 'Title';
                const date = item.release_date || item.first_air_date || '2026';
                const rating = item.vote_average ? item.vote_average.toFixed(1) : '9.0';
                const poster = item.poster_path ? `https://image.tmdb.org/t/p/w500${item.poster_path}` : 'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=500&auto=format&fit=crop&q=60';

                const card = document.createElement('div');
                card.className = 'media-card';
                card.onclick = () => openDetails(item);
                card.innerHTML = `
                    <img class="media-poster" src="${poster}" alt="${title}">
                    <div class="media-info">
                        <div class="media-title">${title}</div>
                        <div class="media-meta">
                            <span>${date.substring(0,4)}</span>
                            <span class="media-rating">⭐ ${rating}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openDetails(item) {
            selectedItem = item;
            document.getElementById('modalTitle').innerText = item.title || item.name;
            document.getElementById('modalDesc').innerText = item.overview || 'Exclusive broadcast in high definition.';
            document.getElementById('videoContainer').style.display = 'none';
            document.getElementById('modalVideo').pause();

            updateModalWatchlistButton();
            document.getElementById('mediaModal').classList.add('active');
        }

        function playVideo() {
            const videoContainer = document.getElementById('videoContainer');
            const videoElement = document.getElementById('modalVideo');
            const sourceElement = document.getElementById('videoSource');

            sourceElement.src = selectedItem.videoUrl || sampleVideos[activeCategory] || sampleVideos.movies;
            videoContainer.style.display = 'block';
            videoElement.load();
            videoElement.play();
        }

        function toggleWatchlist() {
            if(!selectedItem) return;
            const id = selectedItem.id;
            const index = watchlist.findIndex(m => m.id === id);
            
            if(index > -1) {
                watchlist.splice(index, 1);
            } else {
                watchlist.push(selectedItem);
            }
            localStorage.setItem('m_hawk_watchlist', JSON.stringify(watchlist));
            updateWatchlistCount();
            updateModalWatchlistButton();
        }

        function updateModalWatchlistButton() {
            if(!selectedItem) return;
            const btn = document.getElementById('modalWatchlistBtn');
            const exists = watchlist.some(m => m.id === selectedItem.id);
            btn.innerText = exists ? "❌ Remove from Watchlist" : "⭐ Add to Watchlist";
        }

        function showWatchlist() {
            displayMedia(watchlist);
        }

        function searchMedia() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = currentCategoryData.filter(m => {
                const title = (m.title || m.name || '').toLowerCase();
                return title.includes(query);
            });
            displayMedia(filtered);
        }

        function closeModal() {
            document.getElementById('modalVideo').pause();
            document.getElementById('mediaModal').classList.remove('active');
        }

        function closeModalOutside(event) {
            if (event.target.id === 'mediaModal') closeModal();
        }

        function changeLanguage(lang) {
            document.documentElement.lang = lang;
            document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
        }

        // تشغيل القسم الافتراضي (Movies) عند فتح الموقع
        switchCategory('movies');
    </script>
</body>
</html>
