<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.hawk VIP - منصة الأفلام الحصرية</title>
    <link rel="manifest" href="/manifest.json">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 27, 34, 0.85);
            --card-hover: rgba(30, 41, 59, 0.95);
            --accent-color: #e50914;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background: rgba(11, 15, 25, 0.95);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
            color: var(--accent-color);
            letter-spacing: 1px;
        }

        .vip-btn {
            background-color: #25d366; /* لون واتساب المميز لزيادة التحويلات */
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .vip-btn:hover {
            opacity: 0.9;
            transform: scale(1.05);
        }

        .container {
            flex: 1;
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .hero {
            text-align: center;
            padding: 30px 20px;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .hero p {
            color: var(--text-secondary);
            font-size: 16px;
            margin-bottom: 25px;
        }

        /* شريط البحث والتصنيفات الاحترافية */
        .search-filter-box {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
            align-items: center;
        }

        .search-input {
            width: 100%;
            max-width: 500px;
            padding: 12px 20px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-primary);
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        .search-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(229, 9, 20, 0.3);
        }

        .categories-nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .cat-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 14px;
        }

        .cat-btn:hover, .cat-btn.active {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .section-title {
            font-size: 22px;
            margin-bottom: 20px;
            border-right: 4px solid var(--accent-color);
            padding-right: 10px;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .movie-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: 0.3s;
            cursor: pointer;
            position: relative;
        }

        .movie-card:hover {
            transform: translateY(-5px);
            background-color: var(--card-hover);
            border-color: var(--accent-color);
        }

        .movie-poster {
            width: 100%;
            height: 320px;
            object-fit: cover;
            background-color: #1a202c;
        }

        .movie-info {
            padding: 15px;
        }

        .movie-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .movie-meta {
            display: flex;
            justify-content: space-between;
            color: var(--text-secondary);
            font-size: 13px;
        }

        .badge {
            background: rgba(229, 9, 20, 0.2);
            color: var(--accent-color);
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        /* نافذة المشاهدة المباشرة */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .modal-content {
            background: #161b22;
            padding: 20px;
            border-radius: 12px;
            max-width: 800px;
            width: 90%;
            text-align: center;
            border: 1px solid var(--accent-color);
            position: relative;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .close-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        footer {
            text-align: center;
            padding: 20px;
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">M.hawk VIP</div>
        <!-- استبدل # رقم هاتفك بصيغة دولية مثلاً: https://wa.me/212600000000 -->
        <a href="https://wa.me/" target="_blank" class="vip-btn" id="headerVipBtn">💬 اشترك عبر واتساب</a>
    </header>

    <div class="container">
        <div class="hero">
            <h1>أقوى الأفلام والمسلسلات الحصرية</h1>
            <p>استمتع بالمشاهدة بدون إعلانات وبجودة عالية 4K</p>
            
            <!-- شريط البحث والتصنيفات -->
            <div class="search-filter-box">
                <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن فيلمك المفضلة...">
                <div class="categories-nav">
                    <button class="cat-btn active" data-genre="trending">الرائجة الآن</button>
                    <button class="cat-btn" data-genre="28">أكشن</button>
                    <button class="cat-btn" data-genre="27">رعب</button>
                    <button class="cat-btn" data-genre="878">خيال علمي</button>
                    <button class="cat-btn" data-genre="35">كوميديا</button>
                </div>
            </div>
        </div>

        <h2 class="section-title" id="sectionTitle">قائمة الأفلام</h2>
        
        <div class="movies-grid" id="moviesGrid">
            <p style="color: var(--text-secondary);">جاري تحميل أحدث الأفلام...</p>
        </div>
    </div>

    <!-- نافذة المشاهدة المباشرة -->
    <div class="modal" id="videoModal">
        <div class="modal-content">
            <h3 id="modalMovieTitle" style="margin-bottom: 15px; color: #fff;">تشغيل الفيلم</h3>
            <div class="video-container">
                <iframe id="movieIframe" src="" allowfullscreen></iframe>
            </div>
            <button class="close-btn" id="closeModal">إغلاق المشغل</button>
        </div>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة © M.hawk Platform 2026</p>
    </footer>

    <script>
        const TMDB_API_KEY = '65fb47dac159884604660e91b9fbe2d3'; 
        let allMovies = [];

        // روابط الأفلام المخصصة للمشتركين (يمكنك إضافة روابطك الكاملة هنا)
        const customMovieLinks = {
            // "Avatar": "رابط_الفيلم_الكامل"
        };

        const modal = document.getElementById('videoModal');
        const closeModal = document.getElementById('closeModal');
        const movieIframe = document.getElementById('movieIframe');
        const modalMovieTitle = document.getElementById('modalMovieTitle');
        const moviesGrid = document.getElementById('moviesGrid');
        const searchInput = document.getElementById('searchInput');
        const catButtons = document.querySelectorAll('.cat-btn');

        closeModal.addEventListener('click', () => {
            modal.style.display = 'none';
            movieIframe.src = '';
        });

        // دالة لجلب الأفلام بناءً على التصنيف
        function fetchMovies(endpointUrl) {
            moviesGrid.innerHTML = '<p style="color: var(--text-secondary);">جاري تحميل الأفلام...</p>';
            fetch(endpointUrl)
                .then(res => res.json())
                .then(data => {
                    allMovies = data.results || [];
                    displayMovies(allMovies);
                })
                .catch(err => {
                    console.error('Error:', err);
                    moviesGrid.innerHTML = '<p style="color: #e50914;">حدث خطأ أثناء جلب الأفلام.</p>';
                });
        }

        // عرض الأفلام في الشبكة
        function displayMovies(movies) {
            moviesGrid.innerHTML = '';
            if(movies.length > 0) {
                movies.forEach(movie => {
                    const posterUrl = movie.poster_path ? `https://image.tmdb.org/t/p/w500${movie.poster_path}` : '';
                    const movieTitle = movie.title || movie.name || 'فيلم حصري';
                    const releaseYear = movie.release_date ? movie.release_date.split('-')[0] : '2026';
                    
                    const card = document.createElement('div');
                    card.className = 'movie-card';
                    card.innerHTML = `
                        <img src="${posterUrl}" alt="${movieTitle}" class="movie-poster">
                        <div class="movie-info">
                            <div class="movie-title">${movieTitle}</div>
                            <div class="movie-meta">
                                <span>${releaseYear} • سينما</span>
                                <span class="badge">VIP</span>
                            </div>
                        </div>
                    `;
                    
                    card.addEventListener('click', () => {
                        modalMovieTitle.textContent = movieTitle;
                        if (customMovieLinks[movieTitle]) {
                            movieIframe.src = customMovieLinks[movieTitle] + '?autoplay=1';
                            modal.style.display = 'flex';
                        } else {
                            fetch(`https://api.themoviedb.org/3/movie/${movie.id}/videos?api_key=${TMDB_API_KEY}&language=ar`)
                                .then(res => res.json())
                                .then(videoData => {
                                    let videoKey = '';
                                    if(videoData.results && videoData.results.length > 0) {
                                        const trailer = videoData.results.find(v => v.type === 'Trailer' || v.site === 'YouTube');
                                        videoKey = trailer ? trailer.key : videoData.results[0].key;
                                    }
                                    movieIframe.src = videoKey ? `https://www.youtube.com/embed/${videoKey}?autoplay=1` : `https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1`;
                                    modal.style.display = 'flex';
                                })
                                .catch(() => {
                                    movieIframe.src = `https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1`;
                                    modal.style.display = 'flex';
                                });
                        }
                    });

                    moviesGrid.appendChild(card);
                });
            } else {
                moviesGrid.innerHTML = '<p style="color: var(--text-secondary);">لا توجد نتائج مطابقة.</p>';
            }
        }

        // جلب الأفلام الرائجة افتراضياً
        fetchMovies(`https://api.themoviedb.org/3/trending/movie/day?api_key=${TMDB_API_KEY}&language=ar`);

        // تفعيل التصنيفات
        catButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                catButtons.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                
                const genre = e.target.getAttribute('data-genre');
                if(genre === 'trending') {
                    fetchMovies(`https://api.themoviedb.org/3/trending/movie/day?api_key=${TMDB_API_KEY}&language=ar`);
                } else {
                    fetchMovies(`https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_API_KEY}&with_genres=${genre}&language=ar`);
                }
            });
        });

        // تفعيل شريط البحث الفوري
        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allMovies.filter(m => (m.title || m.name || '').toLowerCase().includes(term));
            displayMovies(filtered);
        });

        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('/sw.js')
            .then(() => console.log('تم تفعيل تطبيق PWA بنجاح'))
            .catch((err) => console.log('فشل تفعيل الـ PWA', err));
        }
    </script>
</body>
</html>
