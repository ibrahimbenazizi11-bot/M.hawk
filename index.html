        function updateTexts(lang) {
            currentLang = lang;
            const t = translations[lang] || translations['en'];
            
            document.documentElement.lang = lang;
            document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';

            document.getElementById('heroTitle').textContent = t.heroTitle;
            document.getElementById('heroSub').textContent = t.heroSub;
            searchInput.placeholder = t.searchPlaceholder;
            document.getElementById('catTrending').textContent = t.catTrending;
            document.getElementById('catAction').textContent = t.catAction;
            document.getElementById('catHorror').textContent = t.catHorror;
            document.getElementById('catSciFi').textContent = t.catSciFi;
            document.getElementById('catComedy').textContent = t.catComedy;
            document.getElementById('sectionTitle').textContent = t.sectionTitle;
            document.getElementById('vipBtnText').textContent = t.vipBtn;
            closeModal.textContent = t.closeBtn;
            document.getElementById('footerText').textContent = t.footer;
        }

        langSelect.addEventListener('change', (e) => {
            updateTexts(e.target.value);
        });

        closeModal.addEventListener('click', () => {
            modal.style.display = 'none';
            movieIframe.src = '';
        });

        function fetchMovies(endpointUrl) {
            const t = translations[currentLang] || translations['en'];
            moviesGrid.innerHTML = `<p style="color: var(--text-secondary);">${t.loadingText}</p>`;
            
            // إضافة لغة البحث لطلب TMDB لكي تأتي بيانات الأفلام باللغة المختارة
            let separator = endpointUrl.includes('?') ? '&' : '?';
            let localizedUrl = `${endpointUrl}${separator}language=${currentLang}`;

            fetch(localizedUrl)
                .then(res => res.json())
                .then(data => {
                    allMovies = data.results || [];
                    displayMovies(allMovies);
                })
                .catch(err => {
                    console.error('Error:', err);
                    moviesGrid.innerHTML = '<p style="color: #e50914;">Error loading movies.</p>';
                });
        }

        function displayMovies(movies) {
            moviesGrid.innerHTML = '';
            if(movies.length > 0) {
                movies.forEach(movie => {
                    const posterUrl = movie.poster_path ? `https://image.tmdb.org/t/p/w500${movie.poster_path}` : '';
                    const movieTitle = movie.title || movie.name || 'Exclusive Movie';
                    const releaseYear = movie.release_date ? movie.release_date.split('-')[0] : '2026';
                    
                    const card = document.createElement('div');
                    card.className = 'movie-card';
                    card.innerHTML = `
                        <img src="${posterUrl}" alt="${movieTitle}" class="movie-poster">
                        <div class="movie-info">
                            <div class="movie-title">${movieTitle}</div>
                            <div class="movie-meta">
                                <span>${releaseYear} • Cinema</span>
                                <span class="badge">VIP</span>
                            </div>
                        </div>
                    `;
                    
                    card.addEventListener('click', () => {
                        modalMovieTitle.textContent = movieTitle;
                        if (customMovieLinks[movieTitle]) {
                            movieIframe.src = customMovieLinks[movieTitle] + '?autoplay=1';
                            modal.style.display = 'flex';
                        } else {
                            fetch(`https://api.themoviedb.org/3/movie/${movie.id}/videos?api_key=${TMDB_API_KEY}&language=${currentLang}`)
                                .then(res => res.json())
                                .then(videoData => {
                                    let videoKey = '';
                                    if(videoData.results && videoData.results.length > 0) {
                                        const trailer = videoData.results.find(v => v.type === 'Trailer' || v.site === 'YouTube');
                                        videoKey = trailer ? trailer.key : videoData.results[0].key;
                                    }
                                    movieIframe.src = videoKey ? `https://www.youtube.com/embed/${videoKey}?autoplay=1` : `https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1`;
                                    modal.style.display = 'flex';
                                })
                                .catch(() => {
                                    movieIframe.src = `https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1`;
                                    modal.style.display = 'flex';
                                });
                        }
                    });

                    moviesGrid.appendChild(card);
                });
            } else {
                moviesGrid.innerHTML = '<p style="color: var(--text-secondary);">No results found.</p>';
            }
        }

        // جلب الأفلام الأوليّة
        fetchMovies(`https://api.themoviedb.org/3/trending/movie/day?api_key=${TMDB_API_KEY}`);

        catButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                catButtons.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                
                const genre = e.target.getAttribute('data-genre');
                if(genre === 'trending') {
                    fetchMovies(`https://api.themoviedb.org/3/trending/movie/day?api_key=${TMDB_API_KEY}`);
                } else {
                    fetchMovies(`https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_API_KEY}&with_genres=${genre}`);
                }
            });
        });

        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allMovies.filter(m => (m.title || m.name || '').toLowerCase().includes(term));
            displayMovies(filtered);
        });

        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('/sw.js')
            .then(() => console.log('PWA Registered'))
            .catch((err) => console.log('PWA Error', err));
        }
    </script>
</body>
</html>
