<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.hawk VIP - منصة الأفلام الحصرية</title>
    <link rel="manifest" href="/manifest.json">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 27, 34, 0.85);
            --card-hover: rgba(30, 41, 59, 0.95);
            --accent-color: #e50914;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background: rgba(11, 15, 25, 0.95);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
            color: var(--accent-color);
            letter-spacing: 1px;
        }

        .vip-btn {
            background-color: var(--accent-color);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .vip-btn:hover {
            opacity: 0.9;
            transform: scale(1.05);
        }

        .container {
            flex: 1;
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .hero {
            text-align: center;
            padding: 40px 20px;
            margin-bottom: 30px;
        }

        .hero h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .hero p {
            color: var(--text-secondary);
            font-size: 16px;
        }

        .section-title {
            font-size: 22px;
            margin-bottom: 20px;
            border-right: 4px solid var(--accent-color);
            padding-right: 10px;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .movie-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: 0.3s;
            cursor: pointer;
        }

        .movie-card:hover {
            transform: translateY(-5px);
            background-color: var(--card-hover);
            border-color: var(--accent-color);
        }

        .movie-poster {
            width: 100%;
            height: 320px;
            object-fit: cover;
            background-color: #1a202c;
        }

        .movie-info {
            padding: 15px;
        }

        .movie-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .movie-meta {
            display: flex;
            justify-content: space-between;
            color: var(--text-secondary);
            font-size: 13px;
        }

        .badge {
            background: rgba(229, 9, 20, 0.2);
            color: var(--accent-color);
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 20px;
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">M.hawk VIP</div>
        <a href="#vip" class="vip-btn">اشترك في VIP</a>
    </header>

    <div class="container">
        <div class="hero">
            <h1>أقوى الأفلام والمسلسلات الحصرية</h1>
            <p>استمتع بالمشاهدة بدون إعلانات وبجودة عالية 4K</p>
        </div>

        <h2 class="section-title">الأفلام الرائجة الآن (عبر TMDB)</h2>
        
        <div class="movies-grid" id="moviesGrid">
            <p style="color: var(--text-secondary);">جاري تحميل أحدث الأفلام...</p>
        </div>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة © M.hawk Platform 2026</p>
    </footer>

    <script>
        const TMDB_API_KEY = '65fb47dac159884604660e91b9fbe2d3'; 
        const url = `https://api.themoviedb.org/3/trending/movie/day?api_key=${TMDB_API_KEY}&language=ar`;

        fetch(url)
            .then(response => response.json())
            .then(data => {
                const grid = document.getElementById('moviesGrid');
                grid.innerHTML = '';
                
                if(data.results && data.results.length > 0) {
                    data.results.forEach(movie => {
                        const posterUrl = movie.poster_path ? `https://image.tmdb.org/t/p/w500${movie.poster_path}` : '';
                        const movieTitle = movie.title || movie.name || 'فيلم حصري';
                        const releaseYear = movie.release_date ? movie.release_date.split('-')[0] : '2026';
                        
                        const card = `
                            <div class="movie-card">
                                <img src="${posterUrl}" alt="${movieTitle}" class="movie-poster">
                                <div class="movie-info">
                                    <div class="movie-title">${movieTitle}</div>
                                    <div class="movie-meta">
                                        <span>${releaseYear} • سينما</span>
                                        <span class="badge">VIP</span>
                                    </div>
                                </div>
                            </div>
                        `;
                        grid.innerHTML += card;
                    });
                } else {
                    grid.innerHTML = '<p style="color: var(--text-secondary);">لا توجد أفلام متاحة حالياً.</p>';
                }
            })
            .catch(err => {
                console.error('Error fetching TMDB:', err);
                document.getElementById('moviesGrid').innerHTML = '<p style="color: #e50914;">حدث خطأ أثناء جلب الأفلام.</p>';
            });

        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('/sw.js')
            .then(() => console.log('تم تفعيل تطبيق PWA بنجاح'))
            .catch((err) => console.log('فشل تفعيل الـ PWA', err));
        }
    </script>
</body>
</html>
