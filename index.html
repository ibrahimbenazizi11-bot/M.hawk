<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.hawk Platform - Ultimate Entertainment</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 27, 34, 0.85);
            --card-hover: rgba(30, 41, 59, 0.95);
            --accent-color: #e50914;
            --gold-color: #f59e0b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg-color) 70%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .vip-banner {
            width: 100%;
            background: linear-gradient(90deg, #b91c1c, #e50914, #f59e0b);
            color: #fff;
            padding: 12px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            font-weight: 700;
            font-size: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.3);
            z-index: 1001;
            flex-wrap: wrap;
        }

        .vip-btn {
            background: #fff;
            color: #e50914;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        header {
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            gap: 20px;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 26px;
            font-weight: 800;
            color: var(--accent-color);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .search-container {
            flex: 1;
            max-width: 400px;
        }

        .search-input {
            width: 100%;
            background: rgba(15, 23, 42, 0.9);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
        }

        .header-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .watchlist-nav-btn {
            background: rgba(229, 9, 20, 0.2);
            color: var(--text-primary);
            border: 1px solid var(--accent-color);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .lang-select {
            background: rgba(15, 23, 42, 0.9);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        main {
            max-width: 1300px;
            width: 100%;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            flex: 1;
        }

        .hero-section {
            text-align: center;
            max-width: 800px;
        }

        .hero-section h1 {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 15px;
            color: #fff;
        }

        .hero-section p {
            font-size: 16px;
            color: var(--text-secondary);
        }

        .filter-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            width: 100%;
        }

        .filter-btn {
            background: rgba(22, 27, 34, 0.8);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 10px 18px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .filter-btn:hover, .filter-btn.active {
            background: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
            width: 100%;
        }

        .media-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: all 0.4s ease;
        }

        .media-card:hover {
            transform: translateY(-8px);
            border-color: rgba(229, 9, 20, 0.5);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        .media-poster {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            background: #1e293b;
        }

        .media-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .media-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .media-meta {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .media-rating {
            color: var(--gold-color);
            font-weight: 700;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 2000;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: #131b2e;
            border: 1px solid rgba(229, 9, 20, 0.3);
            border-radius: 20px;
            width: 90%;
            max-width: 800px;
            padding: 35px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
        }

        .video-container {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            display: none;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal-title {
            font-size: 26px;
            font-weight: 800;
            color: var(--text-primary);
        }

        .modal-desc {
            font-size: 15px;
            color: var(--text-secondary);
        }

        .modal-actions {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            font-size: 14px;
        }

        .play-btn {
            background: var(--accent-color);
            color: #fff;
        }

        .watchlist-btn {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        footer {
            width: 100%;
            text-align: center;
            padding: 25px;
            color: var(--text-secondary);
            font-size: 13px;
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <div class="vip-banner">
        <span>⭐ Upgrade your experience: Get exclusive 4K quality & ad-free streaming for only $5/month!</span>
        <button class="vip-btn" onclick="alert('Subscription feature coming soon!')">Subscribe Now</button>
    </div>

    <header>
        <div class="logo">M.hawk</div>
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="Search movies, series..." onkeyup="searchMedia()">
        </div>
        <div class="header-actions">
            <button class="watchlist-nav-btn" onclick="showWatchlist()">⭐ Watchlist (<span id="watchlistCount">0</span>)</button>
            <select id="langSelect" class="lang-select" onchange="changeLanguage(this.value)">
                <option value="en" selected>English</option>
                <option value="ar">العربية (Arabic)</option>
                <option value="fr">Français</option>
                <option value="es">Español</option>
                <option value="de">Deutsch</option>
                <option value="it">Italiano</option>
                <option value="ja">日本語 (Japanese)</option>
                <option value="ko">한국어 (Korean)</option>
                <option value="zh">中文 (Chinese)</option>
                <option value="id">Bahasa Indonesia</option>
                <option value="ru">Русский (Russian)</option>
                <option value="tr">Türkçe</option>
                <option value="pt">Português</option>
                <option value="nl">Nederlands</option>
                <option value="pl">Polski</option>
            </select>
        </div>
    </header>

    <main>
        <section class="hero-section">
            <h1>M.hawk Cinematic Platform</h1>
            <p>Explore trending movies and series fetched live via TMDB API in supreme cinematic quality.</p>
        </section>

        <div class="filter-bar">
            <button class="filter-btn active" onclick="switchCategory('movies', this)">🎬 Movies</button>
            <button class="filter-btn" onclick="switchCategory('series', this)">📺 Series</button>
            <button class="filter-btn" onclick="switchCategory('anime', this)">⛩️ Anime</button>
            <button class="filter-btn" onclick="switchCategory('animation', this)">🎨 Animation</button>
            <button class="filter-btn" onclick="switchCategory('documentaries', this)">🌍 Documentaries</button>
            <button class="filter-btn" onclick="switchCategory('football', this)">⚽ Football Live</button>
            <button class="filter-btn" onclick="switchCategory('ufc', this)">🥊 UFC Live</button>
        </div>

        <div class="grid-container" id="mediaGrid"></div>
    </main>

    <div id="mediaModal" class="modal-overlay" onclick="closeModalOutside(event)">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <div id="videoContainer" class="video-container">
                <video id="modalVideo" controls>
                    <source id="videoSource" src="" type="video/mp4">
                </video>
            </div>
            <h2 id="modalTitle" class="modal-title">Title</h2>
            <p id="modalDesc" class="modal-desc">Overview...</p>
            
            <div class="quality-selector" style="display: flex; gap: 10px; align-items: center; margin-top: 5px;">
                <label style="color: var(--text-secondary); font-size: 14px;">Quality:</label>
                <select id="videoQualitySelect" class="lang-select" onchange="changeVideoQuality(this.value)">
                    <option value="720">720p HD</option>
                    <option value="1080" selected>1080p Full HD</option>
                    <option value="4k">⭐ 4K Ultra HD (VIP)</option>
                </select>
            </div>

            <div class="modal-actions">
                <button class="action-btn play-btn" onclick="playVideo()">▶ Play Now</button>
                <button class="action-btn watchlist-btn" id="modalWatchlistBtn" onclick="toggleWatchlist()">⭐ Add to Watchlist</button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 M.hawk Entertainment Hub. All rights reserved.</p>
    </footer>

    <script>
        const API_KEY = 'c44336c1e57c6b5478ebbc61d3106d88';
        let currentCategoryData = [];
        let selectedItem = null;
        let watchlist = JSON.parse(localStorage.getItem('m_hawk_watchlist')) || [];
        let currentLangCode = 'en';

        const tmdbLangMap = {
            en: 'en-US', ar: 'ar-SA', fr: 'fr-FR', es: 'es-ES', de: 'de-DE',
            it: 'it-IT', ja: 'ja-JP', ko: 'ko-KR', zh: 'zh-CN', id: 'id-ID',
            ru: 'ru-RU', tr: 'tr-TR', pt: 'pt-BR', nl: 'nl-NL', pl: 'pl-PL'
        };

        const qualitySources = {
            720: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4",
            1080: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4",
            "4k": "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
        };

        let activeCategory = 'movies';

        function updateWatchlistCount() {
            document.getElementById('watchlistCount').innerText = watchlist.length;
        }
        updateWatchlistCount();

        async function switchCategory(category, btnElement) {
            activeCategory = category;
            if(btnElement) {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btnElement.classList.add('active');
            }

            if(category === 'football' || category === 'ufc') {
                loadLiveSports(category);
                return;
            }

            const langParam = tmdbLangMap[currentLangCode] || 'en-US';
            let urls = [];
            
            if(category === 'movies') {
                urls = [`https://api.themoviedb.org/3/movie/popular?api_key=${API_KEY}&language=${langParam}&page=1`, `https://api.themoviedb.org/3/movie/popular?api_key=${API_KEY}&language=${langParam}&page=2`];
            } else if(category === 'series') {
                urls = [`https://api.themoviedb.org/3/tv/popular?api_key=${API_KEY}&language=${langParam}&page=1`, `https://api.themoviedb.org/3/tv/popular?api_key=${API_KEY}&language=${langParam}&page=2`];
            } else if(category === 'anime') {
                urls = [`https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&with_genres=16&language=${langParam}&page=1`, `https://api.themoviedb.org/3/discover/tv?api_key=${API_KEY}&with_genres=16&language=${langParam}&page=2`];
            } else if(category === 'animation') {
                urls = [`https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=16&language=${langParam}&page=1`, `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=16&language=${langParam}&page=2`];
            } else if(category === 'documentaries') {
                urls = [`https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=99&language=${langParam}&page=1`, `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&with_genres=99&language=${langParam}&page=2`];
            }

            try {
                let combinedResults = [];
                for(let u of urls) {
                    const res = await fetch(u);
                    const data = await res.json();
                    if(data.results) combinedResults = combinedResults.concat(data.results);
                }
                if(combinedResults.length === 0) throw new Error("Empty");
                currentCategoryData = combinedResults.map(item => ({...item, category: category}));
                displayMedia(currentCategoryData);
            } catch (err) {
                currentCategoryData = [
                    { id: 1, title: "M.hawk Epic 1", overview: "Blockbuster 4K movie.", vote_average: 9.5, release_date: "2026", poster_path: null }
                ];
                displayMedia(currentCategoryData);
            }
        }

        function loadLiveSports(sport) {
            currentCategoryData = sport === 'football' ? [
                { id: 'f1', title: 'UEFA Champions League Live', overview: 'Live 4K European match.', vote_average: 9.9, category: 'football' }
            ] : [
                { id: 'u1', title: 'UFC Main Event Live', overview: 'Explosive MMA fights live.', vote_average: 9.8, category: 'ufc' }
            ];
            displayMedia(currentCategoryData);
        }

        function displayMedia(items) {
            const grid = document.getElementById('mediaGrid');
            grid.innerHTML = '';
            items.forEach(item => {
                const title = item.title || item.name || 'Title';
                const date = item.release_date || item.first_air_date || '2026';
                const rating = item.vote_average ? item.vote_average.toFixed(1) : '9.0';
                const poster = item.poster_path ? `https://image.tmdb.org/t/p/w500${item.poster_path}` : 'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=500&auto=format&fit=crop&q=60';

                const card = document.createElement('div');
                card.className = 'media-card';
                card.onclick = () => openDetails(item);
                card.innerHTML = `
                    <img class="media-poster" src="${poster}" alt="${title}">
                    <div class="media-info">
                        <div class="media-title">${title}</div>
                        <div class="media-meta">
                            <span>${date.substring(0,4)}</span>
                            <span class="media-rating">⭐ ${rating}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openDetails(item) {
            selectedItem = item;
            document.getElementById('modalTitle').innerText = item.title || item.name;
            document.getElementById('modalDesc').innerText = item.overview || 'Exclusive broadcast.';
            document.getElementById('videoContainer').style.display = 'none';
            document.getElementById('modalVideo').pause();
            document.getElementById('videoQualitySelect').value = '1080';
            updateModalWatchlistButton();
            document.getElementById('mediaModal').classList.add('active');
        }

        function playVideo() {
            const videoContainer = document.getElementById('videoContainer');
            const videoElement = document.getElementById('modalVideo');
            const sourceElement = document.getElementById('videoSource');
            const quality = document.getElementById('videoQualitySelect').value;
            
            if (quality === '4k') {
                const isVipUser = false; 
                if (!isVipUser) {
                    alert("⭐ 4K Ultra HD quality is exclusive to VIP members ($5/month)! Upgrade your experience.");
                    document.getElementById('videoQualitySelect').value = '1080';
                    sourceElement.src = qualitySources[1080];
                } else {
                    sourceElement.src = qualitySources['4k'];
                }
            } else {
                sourceElement.src = qualitySources[quality] || qualitySources[1080];
            }

            videoContainer.style.display = 'block';
            videoElement.load();
            videoElement.play();
        }

        function changeVideoQuality(quality) {
            if (document.getElementById('videoContainer').style.display === 'block') {
                playVideo();
            }
        }

        function toggleWatchlist() {
            if(!selectedItem) return;
            const index = watchlist.findIndex(m => m.id === selectedItem.id);
            if(index > -1) watchlist.splice(index, 1);
            else watchlist.push(selectedItem);
            localStorage.setItem('m_hawk_watchlist', JSON.stringify(watchlist));
            updateWatchlistCount();
            updateModalWatchlistButton();
        }

        function updateModalWatchlistButton() {
            if(!selectedItem) return;
            const btn = document.getElementById('modalWatchlistBtn');
            const exists = watchlist.some(m => m.id === selectedItem.id);
            btn.innerText = exists ? "❌ Remove from Watchlist" : "⭐ Add to Watchlist";
        }

        function showWatchlist() { displayMedia(watchlist); }

        function searchMedia() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = currentCategoryData.filter(m => (m.title || m.name || '').toLowerCase().includes(query));
            displayMedia(filtered);
        }

        function closeModal() {
            document.getElementById('modalVideo').pause();
            document.getElementById('mediaModal').classList.remove('active');
        }

        function closeModalOutside(event) {
            if (event.target.id === 'mediaModal') closeModal();
        }

        function changeLanguage(lang) {
            currentLangCode = lang;
            document.documentElement.lang = lang;
            document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
            if(activeCategory !== 'football' && activeCategory !== 'ufc') switchCategory(activeCategory);
        }

        switchCategory('movies');
    </script>
</body>
</html>
